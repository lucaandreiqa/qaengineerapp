# Copy to .github/workflows/qa.yml in the repo of the website you want to test.
# Secrets: Settings → Secrets and variables → Actions.
name: Website QA

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to test
        required: true
  deployment_status:
  schedule:
    - cron: "0 6 * * 1-5"   # weekdays 06:00 UTC

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lucaandreiqa/qaengineerapp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-ci.txt && python -m playwright install --with-deps chromium
      - name: Run QA checks
        env:
          QA_APP_JIRA_ENABLED: "true"
          QA_APP_JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          QA_APP_JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          QA_APP_JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          QA_APP_JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          QA_APP_SLACK_ENABLED: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
          QA_APP_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -m qa_app.cli "${{ inputs.url || github.event.deployment_status.environment_url || vars.QA_TARGET_URL }}" \
            --checks all --max-pages 25 --publish --out qa-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: qa-results/
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: qa-results/junit.xml
